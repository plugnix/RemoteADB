# iroh-relay configuration for a private remoteadb relay.
#
# Run with:
#   iroh-relay --config-path /etc/iroh-relay/iroh-relay.toml
#
# Notes:
# - iroh-relay handles its own Let's Encrypt certificates; nothing sits in
#   front of it. Port 80 must be reachable for the ACME HTTP-01 challenge and
#   port 443 needs CAP_NET_BIND_SERVICE or root.
# - The access allowlist is the part that makes the relay private: only the
#   endpoint IDs listed here may home on it. Add every remoteadb host and
#   client (`remoteadb id` prints each machine's ID). Restart iroh-relay
#   after editing.
# - The matching iroh-relay version for this build of remoteadb is 1.3.x:
#   cargo install iroh-relay --version 1.3.0 --locked

enable_relay = true
http_bind_addr = "[::]:80"

[tls]
https_bind_addr = "[::]:443"
cert_mode = "LetsEncrypt"
hostname = "relay.example.com"
contact = "you@example.com"
# true uses the production Let's Encrypt endpoint. Set to false while testing
# so you do not burn through the production rate limit.
prod_tls = true

# Only these endpoint IDs can use the relay. Replace with your own.
access.allowlist = [
    # "aaaaaaaabbbbbbbbccccccccddddddddeeeeeeeeffffffff0000000011111111",
]
